    const select = document.getElementById('mode');
    Object.keys(modeData).forEach((name) => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });
    function colorFor(count, maxCount) {
      const ratio = Math.max(0, Math.min(1, count / Math.max(maxCount, 1)));
      const red = Math.round(40 + 210 * ratio);
      const blue = Math.round(190 - 120 * ratio);
      return `rgb(${red}, 70, ${blue})`;
    }
    function renderMode(name) {
      layerGroup.clearLayers();
      const rows = modeData[name] || [];
      const maxCount = rows.reduce((m, row) => Math.max(m, row.count || 0), 0);
      rows.forEach((row) => {
        const marker = L.circleMarker([row.latitude, row.longitude], {
          radius: Math.max(4, Math.min(34, row.size || 6)),
          fillColor: colorFor(row.count, maxCount),
          color: '#222',
          weight: 0.5,
          opacity: 0.8,
          fillOpacity: 0.72
        });
        marker.bindPopup(`<strong>${row.location}</strong><br>Count: ${row.count}`);
        marker.addTo(layerGroup);
      });
    }
    select.addEventListener('change', () => renderMode(select.value));
    renderMode(select.value);
